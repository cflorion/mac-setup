<text x="88" y="747" font-size="13.5" fill="#334155">Application / espace</text>
<rect x="294" y="732" width="20" height="20" rx="5" fill="#0e7490" stroke="#00000022"/>
<text x="322" y="747" font-size="13.5" fill="#334155">Fenêtres &amp; disposition</text>
<rect x="546" y="732" width="20" height="20" rx="5" fill="#b45309" stroke="#00000022"/>
<text x="574" y="747" font-size="13.5" fill="#334155">Souris &amp; lanceur</text>
<rect x="744" y="732" width="20" height="20" rx="5" fill="#f1f5f9" stroke="#00000022"/>
<text x="772" y="747" font-size="13.5" fill="#334155">Libre</text>
<text x="60" y="784" font-size="16" font-weight="700" fill="#0f172a">Modes (Hyper ouvre, puis…)</text>
<text x="60" y="808" font-size="13.5" fill="#334155">Hyper + ^ / $  →  focus fenêtre gauche / droite (touches à droite de P, direct sans mode)</text>
<text x="60" y="830" font-size="13.5" fill="#334155">Hyper + D  →  mode Move : tape la lettre de l’espace pour y envoyer la fenêtre (Échap annule)</text>
<text x="60" y="852" font-size="13.5" fill="#334155">Hyper + Tab  →  mode Focus (repli, h j k l) — Cmd+Tab est souvent capté par macOS</text>
<text x="60" y="874" font-size="13.5" fill="#334155">Hyper + R  →  mode Resize : h l = largeur ∓ · j k = hauteur ± </text>
<text x="60" y="896" font-size="13.5" fill="#334155">Hyper + Espace  →  bascule flottant ⇄ pavé · Hyper + ← →  déplace la fenêtre vers l’autre moniteur</text>
<text x="60" y="944" font-size="16" font-weight="700" fill="#0f172a">Notes</text>
<text x="60" y="968" font-size="13.5" fill="#334155">Chiffres 1–3 : Hyper inclut ⇧, donc le chiffre est bien émis (pas @ &amp; «).</text>
<text x="60" y="990" font-size="13.5" fill="#334155">Raycast ×4 : , ; : = lancent 4 commandes Raycast (config Raycast binaire, non détaillée ici).</text>
<text x="60" y="1012" font-size="13.5" fill="#334155">Hors-Hyper : un appui sur ⌥ (gauche ou droite) déclenche la dictée Handy (⌃⌥⌘D).</text>
<text x="60" y="1034" font-size="13.5" fill="#334155">Apps dont la touche n’est pas l’initiale : B→Safari (Browser), M→Superhuman (Mail), Y→Kaset (YouTube), A→Notion Calendar (Agenda), V→Google Chat.</text>
</svg>