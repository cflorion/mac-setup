# AeroSpace - tiling window manager
# Docs: https://nikitabobko.github.io/AeroSpace/guide

start-at-login = true

# Move mouse to the center of the focused window
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Notify sketchybar on workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]

# Normalizations (recommended defaults)
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout: tiling
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Gaps between windows
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 0
outer.bottom = 0
outer.top = [{ monitor.'Built-in Retina Display' = 2 }, 33]
outer.right = 0

# Ensure Homebrew binaries are available in exec commands
[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = '${HOME}/.local/bin:/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# French AZERTY keyboard: remap keys that differ from QWERTY
[key-mapping.key-notation-to-key-code]
a = 'q'
z = 'w'
q = 'a'
w = 'z'
m = 'semicolon'
comma = 'm'
semicolon = 'comma'

# ----------------------------
# Main keybindings
# ----------------------------
[mode.main.binding]

# Focus: hyper + h/j/k/l (vim-style)
cmd-ctrl-alt-shift-h = 'focus --boundaries-action wrap-around-the-workspace left'
cmd-ctrl-alt-shift-j = 'focus --boundaries-action wrap-around-the-workspace down'
cmd-ctrl-alt-shift-k = 'focus --boundaries-action wrap-around-the-workspace up'
cmd-ctrl-alt-shift-l = 'focus --boundaries-action wrap-around-the-workspace right'

# Layout
cmd-ctrl-alt-shift-comma = 'layout tiles horizontal vertical'
cmd-ctrl-alt-shift-period = 'layout tiles vertical horizontal'
cmd-ctrl-alt-shift-f = 'fullscreen'
cmd-ctrl-alt-shift-space = 'layout floating tiling'

# Move window to another monitor
cmd-ctrl-alt-shift-left = 'move-node-to-monitor --wrap-around left'
cmd-ctrl-alt-shift-right = 'move-node-to-monitor --wrap-around right'

# Resize mode
cmd-ctrl-alt-shift-r = 'mode resize'


# ----------------------------
# Named workspaces
# Règle : raccourci = initiale de l'app = nom du workspace
# Réservés (ne pas utiliser) : h j k l f r
# ----------------------------

# Switch to workspace (finds app window wherever it is) or launch app (on-window-detected handles workspace)
cmd-ctrl-alt-shift-c = 'exec-and-forget aerospace-focus-or-open C com.anthropic.claudefordesktop Claude'
cmd-ctrl-alt-shift-w = 'exec-and-forget aerospace-focus-or-open W com.github.wez.wezterm WezTerm'
cmd-ctrl-alt-shift-s = 'exec-and-forget aerospace-focus-or-open S com.apple.Safari Safari'
cmd-ctrl-alt-shift-m = 'exec-and-forget aerospace-focus-or-open M com.superhuman.electron Superhuman'
cmd-ctrl-alt-shift-n = 'exec-and-forget aerospace-focus-or-open N com.tinyspeck.slackmacgap Slack'
cmd-ctrl-alt-shift-g = 'exec-and-forget aerospace-focus-or-open G com.google.Chrome.app.pommaclcbfghclhalboakcipcmmndhcj "$HOME/Applications/Chrome Apps.localized/Google Chat.app"'
cmd-ctrl-alt-shift-o = 'exec-and-forget aerospace-focus-or-open O md.obsidian Obsidian'
cmd-ctrl-alt-shift-t = 'exec-and-forget aerospace-focus-or-open T com.TickTick.task.mac TickTick'
cmd-ctrl-alt-shift-i = 'exec-and-forget aerospace-focus-or-open I com.cron.electron "Notion Calendar"'
cmd-ctrl-alt-shift-p = 'exec-and-forget aerospace-focus-or-open P com.linear Linear'
cmd-ctrl-alt-shift-y = 'exec-and-forget aerospace-focus-or-open Y com.sertacozercan.Kaset Kaset'
cmd-ctrl-alt-shift-x = 'exec-and-forget aerospace-focus-or-open X com.google.Chrome "Google Chrome"'

# Free workspaces (1-5)
cmd-ctrl-alt-shift-1 = 'workspace 1'
cmd-ctrl-alt-shift-2 = 'workspace 2'
cmd-ctrl-alt-shift-3 = 'workspace 3'
cmd-ctrl-alt-shift-4 = 'workspace 4'
cmd-ctrl-alt-shift-5 = 'workspace 5'

# Move window to workspace — via mode 'move' (hyper + d, puis lettre/chiffre)
cmd-ctrl-alt-shift-d = 'mode move'

# ----------------------------
# Move mode (send window to workspace)
# Enter: hyper+d, then type the workspace key
# ----------------------------
[mode.move.binding]
c = ['move-node-to-workspace C --focus-follows-window', 'mode main']
w = ['move-node-to-workspace W --focus-follows-window', 'mode main']
s = ['move-node-to-workspace S --focus-follows-window', 'mode main']
m = ['move-node-to-workspace M --focus-follows-window', 'mode main']
n = ['move-node-to-workspace N --focus-follows-window', 'mode main']
g = ['move-node-to-workspace G --focus-follows-window', 'mode main']
p = ['move-node-to-workspace P --focus-follows-window', 'mode main']
o = ['move-node-to-workspace O --focus-follows-window', 'mode main']
t = ['move-node-to-workspace T --focus-follows-window', 'mode main']
i = ['move-node-to-workspace I --focus-follows-window', 'mode main']
y = ['move-node-to-workspace Y --focus-follows-window', 'mode main']
x = ['move-node-to-workspace X --focus-follows-window', 'mode main']
1 = ['move-node-to-workspace 1 --focus-follows-window', 'mode main']
2 = ['move-node-to-workspace 2 --focus-follows-window', 'mode main']
3 = ['move-node-to-workspace 3 --focus-follows-window', 'mode main']
4 = ['move-node-to-workspace 4 --focus-follows-window', 'mode main']
5 = ['move-node-to-workspace 5 --focus-follows-window', 'mode main']
esc = 'mode main'

# ----------------------------
# Resize mode
# ----------------------------
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
esc = 'mode main'
enter = 'mode main'

# ----------------------------
# Service mode (advanced)
# ----------------------------
[mode.service.binding]
q = ['close-all-windows-but-current', 'mode main']
f = ['flatten-workspace-tree', 'mode main']
r = ['reload-config', 'mode main']
esc = 'mode main'

# ----------------------------
# Window rules: assign apps to workspaces
# ----------------------------

# AI - Claude (C)
[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = ['move-node-to-workspace C', 'workspace C']

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = ['move-node-to-workspace C', 'workspace C']

# Terminal - WezTerm (W)
[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = ['move-node-to-workspace W', 'workspace W']

# Browser - Safari (S)
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace S', 'workspace S']

# Mail - Superhuman (M)
[[on-window-detected]]
if.app-id = 'com.superhuman.electron'
run = ['move-node-to-workspace M', 'workspace M']

# Notifications - Slack (N)
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace N', 'workspace N']

# Google Chat PWA (G) — Chrome PWA
[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.pommaclcbfghclhalboakcipcmmndhcj'
run = ['move-node-to-workspace G', 'workspace G']

# Issue Tracking - Linear (P = Project)
[[on-window-detected]]
if.app-id = 'com.linear'
run = ['move-node-to-workspace P', 'workspace P']

# Notes - Obsidian (O)
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace O', 'workspace O']

# Tasks - TickTick (T)
[[on-window-detected]]
if.app-id = 'com.TickTick.task.mac'
run = ['move-node-to-workspace T', 'workspace T']

# Calendar - Notion Calendar (I)
[[on-window-detected]]
if.app-id = 'com.cron.electron'
run = ['move-node-to-workspace I', 'workspace I']

# Music - Kaset / YouTube Music (Y)
[[on-window-detected]]
if.app-id = 'com.sertacozercan.Kaset'
run = ['move-node-to-workspace Y', 'workspace Y']

# Browser - Google Chrome (X)
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace X', 'workspace X']

# Always floating (dialogs, utilities)
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.archiveutility'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

# All other apps: floating by default
[[on-window-detected]]
run = 'layout floating'
