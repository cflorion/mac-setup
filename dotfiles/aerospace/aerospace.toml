# AeroSpace - tiling window manager
# Docs: https://nikitabobko.github.io/AeroSpace/guide

start-at-login = true

# Move mouse to the center of the focused window
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Notify sketchybar on workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]

# Launch every workspace app at startup; the on-window-detected rules below
# route each window to its space. `open -g` launches in the background to limit
# focus stealing during the burst. `open` is idempotent (no-op if already running).
# Order = SketchyBar display order. The focused workspace settles on whichever
# window appears last (window detection is async), so it is not deterministic.
after-startup-command = [
    'exec-and-forget open -g -b com.github.wez.wezterm',                          # W WezTerm
    'exec-and-forget open -g -b com.superhuman.electron',                         # M Mail Pro
    'exec-and-forget open -g -b com.tinyspeck.slackmacgap',                       # S Slack
    'exec-and-forget open -g "$HOME/Applications/Chrome Apps.localized/Google Chat.app"',  # C Chat
    'exec-and-forget open -g -b com.linear',                                      # L Linear
    'exec-and-forget open -g -b md.obsidian',                                     # O Obsidian
    'exec-and-forget open -g -b com.TickTick.task.mac',                           # T TickTick
    'exec-and-forget open -g -b com.cron.electron',                               # A Agenda (Notion Calendar)
    'exec-and-forget open -g -b net.imput.helium',                               # H Helium
    'exec-and-forget open -g -b com.apple.Safari',                                # B Safari
    'exec-and-forget open -g -b com.google.GeminiMacOS',                          # G Gemini
    'exec-and-forget open -g -b com.sertacozercan.Kaset',                         # Y YT Music (Kaset)
]

# Normalizations (recommended defaults)
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout: tiling
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Gaps between windows
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 0
outer.bottom = 0
outer.top = [{ monitor.'Built-in Retina Display' = 2 }, 33]
outer.right = 0

# Ensure Homebrew binaries are available in exec commands
[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = '${HOME}/.local/bin:/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# French AZERTY keyboard: remap keys that differ from QWERTY
[key-mapping.key-notation-to-key-code]
a = 'q'
z = 'w'
q = 'a'
w = 'z'
m = 'semicolon'
comma = 'm'
semicolon = 'comma'

# ----------------------------
# Main keybindings
# ----------------------------
[mode.main.binding]

# Focus mode
cmd-ctrl-alt-shift-tab = 'mode focus'

# Layout
cmd-ctrl-alt-shift-f = 'fullscreen'
cmd-ctrl-alt-shift-space = 'layout floating tiling'

# Move window to another monitor
cmd-ctrl-alt-shift-left = 'move-node-to-monitor --wrap-around left'
cmd-ctrl-alt-shift-right = 'move-node-to-monitor --wrap-around right'

# Cycle workspaces (linear, matches SketchyBar order)
cmd-ctrl-alt-shift-up   = 'exec-and-forget aerospace-workspace-cycle prev'
cmd-ctrl-alt-shift-down = 'exec-and-forget aerospace-workspace-cycle next'

# Resize mode
cmd-ctrl-alt-shift-r = 'mode resize'

# Service mode (reload config, flatten, close all) — not bound, accessible via CLI: aerospace reload-config
# cmd-ctrl-alt-shift-v was here but freed for Google Chat (workspace V)


# ----------------------------
# Named workspaces
# Règle : raccourci = initiale de l'app = nom du workspace
# Réservés (ne pas utiliser) : f r tab
# ----------------------------

# Switch to workspace (finds app window wherever it is) or launch app (on-window-detected handles workspace)
cmd-ctrl-alt-shift-w = 'exec-and-forget aerospace-focus-or-open W com.github.wez.wezterm WezTerm'
cmd-ctrl-alt-shift-b = 'exec-and-forget aerospace-focus-or-open B com.apple.Safari Safari'
cmd-ctrl-alt-shift-m = 'exec-and-forget aerospace-focus-or-open M com.superhuman.electron Superhuman'
cmd-ctrl-alt-shift-s = 'exec-and-forget aerospace-focus-or-open S com.tinyspeck.slackmacgap Slack'
cmd-ctrl-alt-shift-g = 'exec-and-forget aerospace-focus-or-open G com.google.GeminiMacOS Gemini'
cmd-ctrl-alt-shift-c = 'exec-and-forget aerospace-focus-or-open C com.google.Chrome.app.pommaclcbfghclhalboakcipcmmndhcj "$HOME/Applications/Chrome Apps.localized/Google Chat.app"'
cmd-ctrl-alt-shift-o = 'exec-and-forget aerospace-focus-or-open O md.obsidian Obsidian'
cmd-ctrl-alt-shift-t = 'exec-and-forget aerospace-focus-or-open T com.TickTick.task.mac TickTick'
cmd-ctrl-alt-shift-a = 'exec-and-forget aerospace-focus-or-open A com.cron.electron "Notion Calendar"'
cmd-ctrl-alt-shift-l = 'exec-and-forget aerospace-focus-or-open L com.linear Linear'
cmd-ctrl-alt-shift-y = 'exec-and-forget aerospace-focus-or-open Y com.sertacozercan.Kaset Kaset'
cmd-ctrl-alt-shift-h = 'exec-and-forget aerospace-focus-or-open H net.imput.helium Helium'
# Free workspaces (1-3)
cmd-ctrl-alt-shift-1 = 'workspace 1'
cmd-ctrl-alt-shift-2 = 'workspace 2'
cmd-ctrl-alt-shift-3 = 'workspace 3'

# Move window to workspace — via mode 'move' (hyper + d, puis lettre/chiffre)
cmd-ctrl-alt-shift-d = 'mode move'

# ----------------------------
# Move mode (send window to workspace)
# Enter: hyper+d, then type the workspace key
# ----------------------------
[mode.move.binding]
w = ['move-node-to-workspace W --focus-follows-window', 'mode main']
s = ['move-node-to-workspace S --focus-follows-window', 'mode main']
m = ['move-node-to-workspace M --focus-follows-window', 'mode main']
b = ['move-node-to-workspace B --focus-follows-window', 'mode main']
g = ['move-node-to-workspace G --focus-follows-window', 'mode main']
c = ['move-node-to-workspace C --focus-follows-window', 'mode main']
l = ['move-node-to-workspace L --focus-follows-window', 'mode main']
o = ['move-node-to-workspace O --focus-follows-window', 'mode main']
t = ['move-node-to-workspace T --focus-follows-window', 'mode main']
a = ['move-node-to-workspace A --focus-follows-window', 'mode main']
y = ['move-node-to-workspace Y --focus-follows-window', 'mode main']
h = ['move-node-to-workspace H --focus-follows-window', 'mode main']
1 = ['move-node-to-workspace 1 --focus-follows-window', 'mode main']
2 = ['move-node-to-workspace 2 --focus-follows-window', 'mode main']
3 = ['move-node-to-workspace 3 --focus-follows-window', 'mode main']
esc = 'mode main'

# ----------------------------
# Focus mode
# ----------------------------
[mode.focus.binding]
h = 'focus --boundaries-action wrap-around-the-workspace left'
j = 'focus --boundaries-action wrap-around-the-workspace down'
k = 'focus --boundaries-action wrap-around-the-workspace up'
l = 'focus --boundaries-action wrap-around-the-workspace right'
esc = 'mode main'
enter = 'mode main'

# ----------------------------
# Resize mode
# ----------------------------
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
esc = 'mode main'
enter = 'mode main'

# ----------------------------
# Service mode (advanced)
# ----------------------------
[mode.service.binding]
q = ['close-all-windows-but-current', 'mode main']
f = ['flatten-workspace-tree', 'mode main']
r = ['reload-config', 'mode main']
esc = 'mode main'

# ----------------------------
# Window rules: assign apps to workspaces
# ----------------------------

# Terminal - WezTerm (W)
[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = ['move-node-to-workspace W', 'workspace W']

# Browser - Safari (B)
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace B', 'workspace B']

# Mail - Superhuman (M, affiché « MailPro »)
[[on-window-detected]]
if.app-id = 'com.superhuman.electron'
run = ['move-node-to-workspace M', 'workspace M']

# Notifications - Slack (S)
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace S', 'workspace S']

# AI - Gemini (G)
[[on-window-detected]]
if.app-id = 'com.google.GeminiMacOS'
run = ['move-node-to-workspace G', 'workspace G']

# Google Chat PWA (C) — Chrome PWA
[[on-window-detected]]
if.app-id = 'com.google.Chrome.app.pommaclcbfghclhalboakcipcmmndhcj'
run = ['move-node-to-workspace C', 'workspace C']

# Issue Tracking - Linear (L)
[[on-window-detected]]
if.app-id = 'com.linear'
run = ['move-node-to-workspace L', 'workspace L']

# Notes - Obsidian (O)
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace O', 'workspace O']

# Tasks - TickTick (T)
[[on-window-detected]]
if.app-id = 'com.TickTick.task.mac'
run = ['move-node-to-workspace T', 'workspace T']

# Calendar - Notion Calendar (A = Agenda)
[[on-window-detected]]
if.app-id = 'com.cron.electron'
run = ['move-node-to-workspace A', 'workspace A']

# Music - Kaset / YouTube Music (Y)
[[on-window-detected]]
if.app-id = 'com.sertacozercan.Kaset'
run = ['move-node-to-workspace Y', 'workspace Y']

# Browser - Helium (H)
[[on-window-detected]]
if.app-id = 'net.imput.helium'
run = ['move-node-to-workspace H', 'workspace H']

# Always floating (dialogs, utilities)
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.archiveutility'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'
