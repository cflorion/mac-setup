# AeroSpace - tiling window manager
# Docs: https://nikitabobko.github.io/AeroSpace/guide

start-at-login = true

# Move mouse to the center of the focused window
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Notify sketchybar on workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]

# Normalizations (recommended defaults)
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout: tiling
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Gaps between windows
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 0
outer.bottom = 0
outer.top = 44
outer.right = 0

# Ensure Homebrew binaries are available in exec commands
[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# French AZERTY keyboard: remap keys that differ from QWERTY
[key-mapping.key-notation-to-key-code]
a = 'q'
z = 'w'
q = 'a'
w = 'z'
m = 'semicolon'
comma = 'm'
semicolon = 'comma'

# ----------------------------
# Main keybindings
# ----------------------------
[mode.main.binding]

# Focus: alt + h/j/k/l (vim-style)
alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

# Move window: alt-shift + h/j/k/l
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Layout
alt-comma = 'layout tiles horizontal vertical'
alt-period = 'layout tiles vertical horizontal'
alt-f = 'fullscreen'
alt-shift-f = 'layout floating tiling'

# Resize mode
alt-r = 'mode resize'

# Reload config
alt-shift-r = 'reload-config'

# Service mode (for advanced operations)
alt-shift-semicolon = 'mode service'

# ----------------------------
# Named workspaces
# Règle : raccourci = initiale de l'app = nom du workspace
# Réservés (ne pas utiliser) : h j k l f r
# ----------------------------

# Switch to workspace
alt-c = ['workspace C', 'exec-and-forget open -a Claude']
alt-w = ['workspace W', 'exec-and-forget open -a WezTerm']
alt-s = ['workspace S', 'exec-and-forget open -a Safari']
alt-m = ['workspace M', 'exec-and-forget open -a Superhuman']
alt-n = ['workspace N', 'exec-and-forget open -a Slack']
alt-o = ['workspace O', 'exec-and-forget open -a Obsidian']
alt-t = ['workspace T', 'exec-and-forget open -a TickTick']
alt-i = ['workspace I', 'exec-and-forget open ~/Applications/Calendar.app']

# Free workspaces (1-5)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

# Move window to workspace
alt-shift-c = 'move-node-to-workspace C --focus-follows-window'
alt-shift-w = 'move-node-to-workspace W --focus-follows-window'
alt-shift-s = 'move-node-to-workspace S --focus-follows-window'
alt-shift-m = 'move-node-to-workspace M --focus-follows-window'
alt-shift-n = 'move-node-to-workspace N --focus-follows-window'
alt-shift-o = 'move-node-to-workspace O --focus-follows-window'
alt-shift-t = 'move-node-to-workspace T --focus-follows-window'
alt-shift-i = 'move-node-to-workspace I --focus-follows-window'

alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'

# ----------------------------
# Resize mode
# ----------------------------
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
esc = 'mode main'
enter = 'mode main'

# ----------------------------
# Service mode (advanced)
# ----------------------------
[mode.service.binding]
q = ['close-all-windows-but-current', 'mode main']
f = ['flatten-workspace-tree', 'mode main']
r = ['reload-config', 'mode main']
esc = 'mode main'

# ----------------------------
# Window rules: assign apps to workspaces
# ----------------------------

# AI - Claude (C)
[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = ['move-node-to-workspace C', 'workspace C']

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = ['move-node-to-workspace C', 'workspace C']

# Terminal - WezTerm (W)
[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = ['move-node-to-workspace W', 'workspace W']

# Browser - Safari (S)
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace S', 'workspace S']

# Mail - Superhuman (M)
[[on-window-detected]]
if.app-id = 'com.superhuman.electron'
run = ['move-node-to-workspace M', 'workspace M']

# Notifications - Slack (N)
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace N', 'workspace N']

# Notes - Obsidian (O)
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace O', 'workspace O']

# Tasks - TickTick (T)
[[on-window-detected]]
if.app-id = 'com.TickTick.task.mac'
run = ['move-node-to-workspace T', 'workspace T']

# Calendar PWA (I = iCal)
[[on-window-detected]]
if.app-id = 'com.apple.Safari.WebApp.98B1A91D-38E6-48AA-AF09-76C6A8D78DCB'
run = ['move-node-to-workspace I', 'workspace I']

# Always floating (dialogs, utilities)
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.archiveutility'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'

# All other apps: floating by default
[[on-window-detected]]
run = 'layout floating'
