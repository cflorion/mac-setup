# ----------------------------
# tmux - simple best practices
# ----------------------------

# Prefix: Ctrl-a (more accessible than default Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse (scroll, resize, click on pane/window)
set -g mouse on

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Generous scrollback history
set -g history-limit 10000

# 256 color / true color support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Reduce Escape delay (important for vim/neovim)
set -sg escape-time 10

# Reload config easily: prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Intuitive splits: | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows in current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation with h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Clean status bar
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold]#S "
set -g status-right "%H:%M"
set -g status-left-length 20

# Dark/light mode detection (tmux 3.6+ / Ghostty Mode 2031)
set-hook -g client-dark-theme {
    set -g status-style "bg=default,fg=white"
    refresh-client -S
}

set-hook -g client-light-theme {
    set -g status-style "bg=default,fg=black"
    refresh-client -S
}
